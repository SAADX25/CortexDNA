name: Windows verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Tests/CortexDNA.Tests.csproj -p:NuGetAudit=false
      - run: dotnet build CortexDNA.csproj --no-restore -c Debug -warnaserror
      - run: dotnet build CortexDNA.csproj --no-restore -c Release -warnaserror
      - run: dotnet run --project Tests/CortexDNA.Tests.csproj --no-restore -c Release
      - run: ./scripts/Build-Release.ps1 -SkipInstaller
